name: SDA static site checks
on:
  push:
    branches: [main, redesign/consulting-2026]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check page structure and local links
        run: python3 scripts/check_site.py
